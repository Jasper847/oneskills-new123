<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ai-g1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ai-g2" x1="14" y1="14" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background algorithmic constellation ring -->
  <circle cx="24" cy="24" r="19" stroke="url(#ai-g1)" stroke-width="1.6" stroke-dasharray="2 4" opacity="0.5"/>
  <!-- Orbiting micro-nodes -->
  <circle cx="10.5" cy="24" r="2.2" fill="#ec4899"/>
  <circle cx="37.5" cy="24" r="2.2" fill="#a855f7"/>
  <circle cx="24" cy="10.5" r="2.2" fill="#c084fc"/>
  <circle cx="24" cy="37.5" r="2.2" fill="#ec4899"/>
  <!-- Core AI Sparkle: 4-pointed precision curved star -->
  <path d="M24 5 C24 15.5, 15.5 24, 5 24 C15.5 24, 24 32.5, 24 43 C24 32.5, 32.5 24, 43 24 C32.5 24, 24 15.5, 24 5 Z"
        fill="url(#ai-g1)" filter="url(#ai-glow)"/>
  <!-- Inner luminous core -->
  <path d="M24 12.5 C24 19, 19 24, 12.5 24 C19 24, 24 29, 24 35.5 C24 29, 29 24, 35.5 24 C29 24, 24 19, 24 12.5 Z"
        fill="url(#ai-g2)"/>
  <!-- Central glowing node -->
  <circle cx="24" cy="24" r="2.2" fill="#a855f7"/>
</svg>