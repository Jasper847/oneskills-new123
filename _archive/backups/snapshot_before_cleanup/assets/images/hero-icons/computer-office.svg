<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="cmp-g1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cmp-g2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="cmp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f97316" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Modern Laptop Display Shell in Coral Orange -->
  <rect x="9" y="10" width="30" height="20" rx="4" stroke="url(#cmp-g1)" stroke-width="2.2" fill="rgba(249, 115, 22, 0.09)"/>
  <!-- Screen Productivity Dashboard: 2x2 Colorful Grid (Word Blue, Excel Green, PPT Orange, Gold Chart) -->
  <rect x="13" y="14" width="9" height="5" rx="1.5" fill="#38bdf8" filter="url(#cmp-glow)"/>
  <rect x="25" y="14" width="10" height="5" rx="1.5" fill="#10b981"/>
  <rect x="13" y="21" width="12" height="5" rx="1.5" fill="#fb923c"/>
  <rect x="27" y="21" width="8" height="5" rx="1.5" fill="#fbbf24" filter="url(#cmp-glow)"/>
  <!-- Laptop Keyboard Base in Coral Gradient -->
  <path d="M5 32 C5 31, 7 30, 9 30 L39 30 C41 30, 43 31, 43 32 L44 34 C44 35, 43 36, 41 36 L7 36 C5 36, 4 35, 4 34 Z" fill="url(#cmp-g1)"/>
  <!-- Center Trackpad notch in crisp white -->
  <rect x="21" y="32" width="6" height="2" rx="0.8" fill="url(#cmp-g2)"/>
</svg>