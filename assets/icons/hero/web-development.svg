<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="web-g1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="web-g2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="web-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Sleek Frameless Browser / Code Canvas outline -->
  <rect x="6" y="8" width="36" height="32" rx="7" stroke="url(#web-g1)" stroke-width="2.2" fill="rgba(14, 165, 233, 0.1)"/>
  <!-- Window Header Line -->
  <line x1="6" y1="17" x2="42" y2="17" stroke="url(#web-g1)" stroke-width="1.6" opacity="0.45"/>
  <!-- Colored Window Dots (Red, Yellow, Green - Classic macOS / Google Chrome Developer style) -->
  <circle cx="12" cy="12.5" r="1.8" fill="#ef4444"/>
  <circle cx="17" cy="12.5" r="1.8" fill="#f59e0b"/>
  <circle cx="22" cy="12.5" r="1.8" fill="#10b981"/>
  <!-- Code Brackets < / > with Center AI Spark -->
  <path d="M17 23 L11 28 L17 33" stroke="url(#web-g2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#web-glow)"/>
  <path d="M31 23 L37 28 L31 33" stroke="url(#web-g2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#web-glow)"/>
  <path d="M26 22 L22 34" stroke="url(#web-g1)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Central tech code node -->
  <circle cx="24" cy="28" r="2.2" fill="#38bdf8"/>
</svg>