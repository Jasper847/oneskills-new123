<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="mkt-g1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="mkt-g2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="mkt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Global market outreach orbit ellipse -->
  <ellipse cx="24" cy="25" rx="19" ry="8" transform="rotate(-30 24 25)" stroke="url(#mkt-g1)" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.55"/>
  <!-- Supersonic Launch Rocket Body (angled 45 degrees for upward momentum) -->
  <path d="M33 7 C26 9, 21 16, 20 22 L16 26 L19 29 L23 25 C29 24, 36 19, 38 12 L38 7 Z"
        fill="url(#mkt-g1)" filter="url(#mkt-glow)"/>
  <!-- Rocket Wings -->
  <path d="M19.5 21.5 L14 20 L16 26 Z" fill="#059669"/>
  <path d="M23.5 25.5 L25 31 L19 29 Z" fill="#059669"/>
  <!-- Cockpit Window / Core Port -->
  <circle cx="28" cy="17" r="3" fill="url(#mkt-g2)"/>
  <circle cx="28" cy="17" r="1.5" fill="#047857"/>
  <!-- Propulsion Energy Trail -->
  <path d="M16 29 L11 34 M18 31 L14 35 M14 27 L10 31" stroke="url(#mkt-g1)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Rising Growth Spark -->
  <circle cx="39" cy="9" r="2.2" fill="#6ee7b7"/>
</svg>